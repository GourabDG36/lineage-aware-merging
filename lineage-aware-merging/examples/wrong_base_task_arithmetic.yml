# The mistake that collapsed our 3-model merge (GSM8K/MBPP 68.0/48.0 -> 6.5/0.0).
# All three models are fine-tunes of Qwen2.5-1.5B-Instruct, but the base is set to Qwen2.5-1.5B.
merge_method: task_arithmetic
base_model: Qwen/Qwen2.5-1.5B
models:
  - model: micaebe/Qwen2.5-1.5B-Instruct-QwQ
    parameters: {weight: 1.0}
  - model: jahyungu/Qwen2.5-1.5B-Instruct_mbpp
    parameters: {weight: 1.0}
  - model: joyboy5656n/business-assistant-llm
    parameters: {weight: 1.0}
dtype: bfloat16
